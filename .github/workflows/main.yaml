name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.20.x', 'stable']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l *.go examples/*/*.go)"
      - name: Test with race detector
        run: go test -race ./... -count=1 -timeout 2m
      - name: Vet
        run: go vet ./...
      - name: Run examples
        run: |
          go run ./examples/basic
          go run ./examples/periodic
          go run ./examples/extended

  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [prometheus, otel]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Check dependency lock and compile with race detector
        run: go test -mod=readonly -race ./...
      - name: Vet
        run: go vet ./...
      - name: Run integration example with race detector
        run: go run -race -mod=readonly .
