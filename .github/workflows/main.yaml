name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.26.x', 'stable']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l *.go examples/*/*.go)"
      - name: Test with race detector
        run: go test -race ./... -count=1 -timeout 2m
      - name: Vet
        run: go vet ./...
      - name: Run structured logging and HTTP example
        run: go run -race ./examples/logging
      - name: Migration fixtures
        working-directory: examples/migration
        run: |
          go test -mod=readonly -race ./... -count=1
          go vet ./...
          go run -race -mod=readonly .
      - name: Fuzz coordinator transitions and indexed heap
        # Go 1.25/1.26 can report a false timeout (golang/go#75804, fixed in 1.27).
        # All matrix versions still run the seed corpus through go test above.
        if: matrix.go-version == 'stable'
        run: |
          go test -run '^$' -fuzz '^FuzzCoordinatorTransitions$' -fuzztime 10s -parallel 2
          go test -run '^$' -fuzz '^FuzzIndexedHeap$' -fuzztime 10s -parallel 2

  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [prometheus, otel]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Check dependency lock and compile with race detector
        run: go test -mod=readonly -race ./...
      - name: Vet
        run: go vet ./...
      - name: Run integration example with race detector
        run: go run -race -mod=readonly .
